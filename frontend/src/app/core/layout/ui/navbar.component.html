<header class="navbar">
  <span class="navbar-title" data-testid="navbar-title">{{ title() }}</span>

  <button
    type="button"
    class="navbar-toggle"
    data-testid="navbar-toggle"
    [attr.aria-label]="layoutStore.collapsed() ? 'Expandir menú' : 'Contraer menú'"
    (click)="layoutStore.toggle()"
  >
    <nz-icon
      [nzType]="layoutStore.collapsed() ? 'menu-unfold' : 'menu-fold'"
      nzTheme="outline"
    />
  </button>
</header>
